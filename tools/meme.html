<!doctype html>
<!--
  The meme for make.fun's "Post a GTA 6 meme on X" bounty, authored as one page and rendered to meme.png by
  tools/render-meme.sh (headless Chromium, 1080x1080, deterministic — no random values, no network, no webfonts).

  The scene is Vice City at sunset, in make.fun's own magenta: the sun, the skyline, the palms, and the ghost of
  make.fun's logo standing in the middle of it — the mascot worked into the scene, never pasted on as a sticker.
  The ghost's paths are make.fun's own press asset (https://make.fun/press/mark.svg, kept beside this file in
  assets/press/), inlined here so the render needs no network. The caption is drawn as SVG text with a heavy
  outline, sized to still read when the picture is shrunk to 480x480 for the judge.
-->
